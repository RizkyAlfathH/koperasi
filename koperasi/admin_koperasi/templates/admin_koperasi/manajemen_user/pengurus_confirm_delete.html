{% extends "admin_koperasi/dashboard.html" %}
{% block content %}

<h4>Hapus Pengurus</h4>

<div class="alert alert-danger mt-3">
    Yakin ingin menghapus <b>{{ user.username }}</b>
    ({{ user.get_role_display }})?
</div>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Ya, Hapus</button>
    <a href="{% url 'admin_koperasi:pengurus_list' %}" class="btn btn-secondary">Batal</a>
</form>

{% endblock %}
