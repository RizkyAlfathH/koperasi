{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>KOPASMEN</title>

    <!-- font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- icon -->
    <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@1.4.2/src/css/icons.css">

    <!-- css -->
    <link rel="stylesheet" href="{% static 'css/pages/admin_koperasi/login.css' %}">
</head>
<body>

<!-- logo -->
<div class="logo-section">
    <img src="{% static 'image/logo_kopasmen.jpg' %}" alt="Logo">
    <div class="company-title">KOPASMEN</div>
</div>

<!-- form -->
<div class="login-wrapper">
    <form method="post" onsubmit="showLoader()">
        {% csrf_token %}
        <!-- username -->
        <div class="input-group">
            <label>Username</label>
            <div class="input-field {% if errors.username %}error{% endif %}">
                <span class="input-icon">
                    <i class="ph ph-user"></i>
                </span>
                <input type="text" name="username" placeholder="Masukkan username..." value="{{ request.POST.username }}">
            </div>
            {% if errors.username %}
                <small class="error-text">{{ errors.username }}</small>
            {% endif %}
        </div>

        <!-- password -->
        <div class="input-group">
            <label>Password</label>
            <div class="input-field password-field {% if errors.password %}error{% endif %}">
                <span class="input-icon">
                    <i class="ph ph-lock"></i>
                </span>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Masukkan password..."
                >
                <span class="toggle-password" onclick="togglePassword()">
                    <i class="ph-eye" id="eyeIcon"></i>
                </span>
            </div>
            {% if errors.password %}
                <small class="error-text">{{ errors.password }}</small>
            {% endif %}
        </div>

        <button type="submit">Login</button>
    </form>
</div>

<script>
/* 
   fungsi untuk toggle password:
   - mengubah tipe input dari password ke text
   - mengganti icon mata sesuai kondisi
*/
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.getElementById("eyeIcon");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.replace("ph-eye", "ph-eye-slash");
    } else {
        password.type = "password";
        icon.classList.replace("ph-eye-slash", "ph-eye");
    }
}
</script>

</body>
</html>
