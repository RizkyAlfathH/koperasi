<div class="navbar">
    <div class="title">KOPASMEN</div>
    <div class="user-info">
        <div class="user-avatar">
            {{ request.user.username|slice:":2"|upper }}
        </div>
        <span>{{ request.user.username|upper }}</span>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const navbar = document.querySelector(".navbar");

    // set posisi awal dari localStorage
    const isCollapsed = localStorage.getItem("sidebarCollapsed") === "true";
    navbar.style.left = isCollapsed ? "100px" : "280px";

    // update saat toggle
    document.addEventListener("sidebarToggled", function(e) {
        const collapsed = e.detail.collapsed;
        navbar.style.left = collapsed ? "100px" : "280px";
    });
});
</script>
