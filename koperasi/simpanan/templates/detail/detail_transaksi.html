{% extends "base.html" %}
{% load static %}

{% block title %}Detail Transaksi{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/simpanan/detail/detail_transaksi.css' %}">
{% endblock %}

{% block content %}

<!-- container utama detail transaksi -->
<div class="content-card">
    <h2>Detail Transaksi</h2>

    <!-- id transaksi dan anggota -->
    <div class="row mb-3">
        <div class="col-md-6">

            <!-- id transaksi -->
            <label>ID Transaksi</label>
            <input type="text"
                   class="form-control"
                   value="{{ transaksi.id }}"
                   readonly>
        </div>

        <div class="col-md-6">

            <!-- nama dan nomor anggota -->
            <label>Nama Anggota</label>
            <input type="text"
                   class="form-control"
                   value="{{ transaksi.anggota.nomor_anggota }} - {{ transaksi.anggota.nama }}"
                   readonly>
        </div>
    </div>

    <!-- jenis simpanan dan tanggal -->
    <div class="row mb-3">
        <div class="col-md-6">

            <!-- jenis simpanan -->
            <label>Jenis Simpanan</label>
            <input type="text"
                   class="form-control"
                   value="{{ transaksi.jenis_simpanan|title }}"
                   readonly>
        </div>

        <div class="col-md-6">

            <!-- tanggal transaksi -->
            <label>Tanggal Transaksi</label>
            <input type="text"
                   class="form-control"
                   value="{{ transaksi.tanggal|date:'d F Y' }}"
                   readonly>
        </div>
    </div>

    <!-- jenis transaksi dan jumlah -->
    <div class="row mb-4">
        <div class="col-md-6">

            <!-- jenis transaksi (masuk / keluar) -->
            <label>Jenis Transaksi</label>
            <input type="text"
                   class="form-control"
                   value="{{ transaksi.get_jenis_transaksi_display }}"
                   readonly>
        </div>

        <div class="col-md-6">

            <!-- jumlah transaksi -->
            <label>Jumlah</label>
            <input type="text"
                   class="form-control rupiah-text"
                   value="Rp {{ transaksi.jumlah|floatformat:0 }}"
                   readonly>
        </div>
    </div>

</div>

<!-- tombol kembali -->
<div class="mt-3">
    <a href="{% url 'simpanan:simpanan_anggota' transaksi.anggota.nomor_anggota %}"
       class="btn-kembali">
        Kembali
    </a>
</div>

{% endblock %}
