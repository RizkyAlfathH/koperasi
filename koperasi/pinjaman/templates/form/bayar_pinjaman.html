{% extends "base.html" %}
{% load static %}
{% load widget_tweaks %}
    
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/pages/pinjaman/form/bayar_pinjaman.css' %}">
{% endblock %}

{% block title %}Bayar Pinjaman{% endblock %}

{% block content %}
<div class="content-card">
    <h2>Bayar Pinjaman</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- DATA UNTUK JAVASCRIPT -->
        <input type="hidden" id="angsuran_pokok" value="{{ angsuran_pokok }}">
        <input type="hidden" id="sisa_pinjaman_awal" value="{{ pinjaman.sisa_pinjaman }}">

        <!-- ROW 1 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label>Nama Anggota</label>
                <input type="text" class="form-control"
                       value="{{ pinjaman.nomor_anggota.nomor_anggota }} - {{ pinjaman.nomor_anggota.nama }}"
                       readonly>
            </div>

            <div class="col-md-6">
                <label>Pinjaman</label>
                <input type="text" class="form-control rupiah-text"
                       value="{{ pinjaman.jumlah_pinjaman|floatformat:0 }}"
                       readonly>
            </div>
        </div>

        <!-- ROW 2 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label>Sisa Pinjaman</label>
                <input type="text" class="form-control rupiah-text"
                       value="{{ pinjaman.sisa_pinjaman|floatformat:0 }}"
                       readonly>
            </div>

            <div class="col-md-6">
                <label>Tanggal</label>
                <input type="date" name="tanggal" class="form-control" required>
            </div>
        </div>

        <!-- ROW 3 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label>Jumlah Cicilan Pokok</label>
                <input type="text" class="form-control rupiah-text"
                       value="{{ angsuran_pokok|floatformat:0 }}"
                       readonly>
            </div>

            <div class="col-md-6">
                <label>Persentase Jasa (%)</label>
                <input type="text" class="form-control persen-format"
                       value="{{ pinjaman.jasa_persen|floatformat:-2|cut:",0" }}%"
                       readonly>
            </div>
        </div>

        <!-- ROW 4 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label>Kategori Jasa</label>
                <input type="text" class="form-control"
                       value="{{ pinjaman.id_kategori_jasa.kategori_jasa }}"
                       readonly>
            </div>

            <div class="col-md-6">
                <label>Pilihan Pembayaran</label>
                <select id="tipe_bayar" name="tipe_bayar" class="form-control">
                    <option value="cicilan">Cicilan + Jasa</option>
                    <option value="jasa">Jasa Saja</option>
                </select>
            </div>
        </div>

        <!-- ROW 5 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <label>Jumlah Bulan Dibayar</label>
                <input type="number" id="jumlah_bulan" name="bulan"
                       class="form-control" min="1" value="1">
                <small id="keterangan_bulan" class="text-muted">
                    Cicilan tersisa: {{ sisa_bulan }} bulan
                </small>
            </div>

            <div class="col-md-6">
                <label>Jumlah Dibayar</label>
                <input type="text" name="nominal"
                       class="form-control rupiah-input"
                       value="{{ total_bayar|floatformat:0 }}"
                       required>
            </div>
        </div>

        <!-- ADMIN -->
        <div class="row mb-4">
            <div class="col-md-6">
                <label>Admin</label>
                <input type="text" class="form-control"
                       value="{{ request.user.username }} ({{ request.user.role }})"
                       readonly>
            </div>
        </div>

        <!-- BUTTON -->
        <div class="form-actions" style="text-align:right;">
            <a href="{% url 'pinjaman:pinjaman_list' %}" class="btn-outline">Batal</a>
            <button type="submit" class="btn-simpan">Bayar</button>
        </div>

    </form>
</div>


<script>
document.addEventListener("DOMContentLoaded", function(){
    const tipeBayar = document.getElementById("tipe_bayar");
    const jumlahInput = document.querySelector("input[name='nominal']");
    const jumlahBulan = document.getElementById("jumlah_bulan");

    const angsuranPokok = parseFloat(document.getElementById("angsuran_pokok").value || 0);
    const jasaPersen = parseFloat("{{ pinjaman.jasa_persen }}".replace(",", ".")) / 100;
    const kategoriJasa = "{{ pinjaman.id_kategori_jasa.kategori_jasa|lower }}";
    const jumlahPinjaman = parseFloat("{{ pinjaman.jumlah_pinjaman }}") || 0;
    const sisaPinjamanAwal = parseFloat(document.getElementById("sisa_pinjaman_awal").value || 0);


    const keteranganBulan = document.getElementById("keterangan_bulan");

    function hitungBayar() {
        let totalBayar = 0;
        let tempSisa = sisaPinjamanAwal;
        let bulan = parseInt(jumlahBulan.value || 1);

        const maxBulan = Math.ceil(tempSisa / angsuranPokok);

        if (bulan > maxBulan) bulan = maxBulan;
        if (bulan < 1) bulan = 1;

        for (let i = 1; i <= bulan; i++) {
        let jasa = 0;

        if (kategoriJasa === "flat") {
            jasa = jumlahPinjaman * jasaPersen;
        } else {
            jasa = tempSisa * jasaPersen;
        }

        if (tipeBayar.value === "cicilan") {
            if (tempSisa - angsuranPokok < 0) break;
            totalBayar += jasa + angsuranPokok;
            tempSisa -= angsuranPokok;
        } 
        else if (tipeBayar.value === "jasa") {
            totalBayar += jasa;
        }
        }

        jumlahBulan.value = bulan;
        jumlahInput.value = totalBayar;

        keteranganBulan.innerText = 
        `Cicilan tersisa: ${Math.ceil(tempSisa / angsuranPokok)} bulan`;
    }

    tipeBayar.addEventListener("change", hitungBayar);
    jumlahBulan.addEventListener("input", hitungBayar);

    hitungBayar();
});
</script>


{% endblock %}
